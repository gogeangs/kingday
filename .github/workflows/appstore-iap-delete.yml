# App Store 인앱 상품·구독 모두 삭제 (손으로 실행할 때만, 되돌릴 수 없음) — tools/appstore_iap_delete.py
# 키는 GitHub Secrets(APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8)만 쓴다.
name: appstore-iap-delete

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '정말 지우려면 DELETE 라고 쓰기'
        required: true

jobs:
  delete:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography requests
      - name: 인앱 상품·구독 삭제
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: python3 tools/appstore_iap_delete.py 2>&1 | tee up.log; st=${PIPESTATUS[0]}; grep -v '^::' up.log | tail -30 | sed 's/^/::notice::/'; exit $st
