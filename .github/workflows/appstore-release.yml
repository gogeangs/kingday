# 아이폰 새 버전 준비 (손으로 실행할 때만): 심사 대기 취소(선택) → 버전 번호·글·스크린샷 → 같은 버전 빌드 붙이기 (tools/appstore_release.py)
# 심사 제출·앱 개인정보는 App Store Connect 화면에서. 키는 GitHub Secrets 만 쓴다.
name: appstore-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Store 버전 번호 (앱 pubspec 과 같게)'
        required: true
        default: '0.0.10'
      cancel:
        description: '심사 대기 중인 제출을 취소할까요? (yes/no)'
        required: true
        default: 'no'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography requests
      - name: 새 버전 준비
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: python3 tools/appstore_release.py "${{ inputs.version }}" "${{ inputs.cancel }}" 2>&1 | tee up.log; st=${PIPESTATUS[0]}; grep -v '^::' up.log | tail -30 | sed 's/^/::notice::/'; exit $st
