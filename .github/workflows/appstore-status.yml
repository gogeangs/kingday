# App Store 심사 상태 보기 (읽기만, 손으로 실행)
# 버전·심사 제출·인앱 상품·구독 상태를 출력만 한다 (tools/appstore_status.py). 아무것도 바꾸지 않음.
# 키는 GitHub Secrets(APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8)만 쓴다.
name: appstore-status

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography requests
      - name: 상태 보기
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: python3 tools/appstore_status.py 2>&1 | tee up.log; st=${PIPESTATUS[0]}; grep -v '^::' up.log | tail -60 | sed 's/^/::notice::/'; exit $st
