# App Store 인앱 상품 심사용 스크린샷 넣기 (손으로 실행할 때만)
# 모든 인앱 구입·구독에 심사용 스크린샷(store/appstore/iap_review.png)을 넣고 상태를 보여 준다 (tools/appstore_iap.py). 심사 제출은 하지 않는다.
# 키는 GitHub Secrets(APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8)만 쓴다.
name: appstore-iap

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography requests
      - name: 심사용 스크린샷 넣기
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: python3 tools/appstore_iap.py 2>&1 | tee up.log; st=${PIPESTATUS[0]}; grep -v '^::' up.log | tail -60 | sed 's/^/::notice::/'; exit $st
