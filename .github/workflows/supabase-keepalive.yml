name: supabase-keepalive
# 무료 플랜은 7일간 요청이 없으면 일시 정지돼요. 매일 한 번 랭킹을 조회해 깨워 둡니다.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping ranking
        run: |
          curl -fsS -X POST 'https://xqrdqigdwfyoaalqalfc.supabase.co/rest/v1/rpc/kd_ranking' \
            -H 'apikey: sb_publishable_b0VfItWh30lKMyHaOSehXQ_lWqe_xTM' \
            -H 'Content-Type: application/json' -d '{"p_season":0}' | head -c 200
