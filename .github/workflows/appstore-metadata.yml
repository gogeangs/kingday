# App Store 글·스크린샷 올리기 (손으로 실행할 때만)
# fastlane/metadata · fastlane/screenshots 를 App Store Connect 의 편집 중인 버전에 올린다.
# 앱 파일(빌드)은 올리지 않고, 심사 제출도 하지 않는다 — 빌드 선택·연령 등급·심사 제출은 App Store Connect 화면에서.
# 키는 GitHub Secrets(APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8)만 쓴다.
name: appstore-metadata

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Store 버전 번호 (앱 pubspec 과 같게)'
        required: true
        default: '0.0.4'

jobs:
  deliver:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: API 키 파일
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["KEY_ID"], "issuer_id": os.environ["ISSUER_ID"], "key": os.environ["KEY_P8"], "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "asc_key.json"), "w"))
          PY
      - name: 글·스크린샷 올리기
        env:
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_TIMESTAMP: '1'
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          set +e
          fastlane run deliver \
            api_key_path:"$RUNNER_TEMP/asc_key.json" \
            app_identifier:kr.co.project30s.kingday \
            platform:ios \
            app_version:"${{ inputs.version }}" \
            metadata_path:fastlane/metadata \
            screenshots_path:fastlane/screenshots \
            skip_binary_upload:true \
            skip_app_version_update:false \
            overwrite_screenshots:true \
            submit_for_review:false \
            automatic_release:false \
            force:true \
            run_precheck_before_submit:false 2>&1 | tee deliver.log
          st=${PIPESTATUS[0]}
          # 로그를 밖에서 못 볼 때를 위해 오류 줄을 알림으로
          if [ $st -ne 0 ]; then grep -E "\[!\]|Error|error|Exception|denied|not found|could not" deliver.log | tail -25 | sed 's/^/::error::/'; grep -v -E "^\s+from |^$" deliver.log | tail -40 | sed 's/^/::warning::/'; fi
          exit $st
