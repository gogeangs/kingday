# App Store 글·스크린샷 올리기 (손으로 실행할 때만)
# fastlane/metadata(글) · fastlane/screenshots/ko(6.9인치 스크린샷)를 App Store Connect 의 편집 중인 버전에 올린다 (tools/appstore_metadata.py).
# 앱 파일(빌드)은 올리지 않고, 심사 제출도 하지 않는다 — 빌드 선택·연령 등급·심사 제출은 App Store Connect 화면에서.
# 키는 GitHub Secrets(APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8)만 쓴다.
name: appstore-metadata

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Store 버전 번호 (앱 pubspec 과 같게)'
        required: true
        default: '0.0.4'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography requests
      - name: 글·스크린샷 올리기
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: python3 tools/appstore_metadata.py "${{ inputs.version }}" 2>&1 | tee up.log; st=${PIPESTATUS[0]}; grep -v '^::' up.log | tail -30 | sed 's/^/::notice::/'; exit $st
