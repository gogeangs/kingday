# 아이폰 심사 바꿔 내기 (대표님 「전송해」 뒤에만) — tools/appstore_swap.py
# appstore/swap 브랜치에 올릴 때만 돈다. 할 일은 tools/appstore_swap.args (check = 읽기만, go = 실제로 바꿈)
# 키는 GitHub Secrets(APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8)만 쓴다.
name: appstore-swap

on:
  push:
    branches: ['appstore/swap']
    paths: ['tools/appstore_swap.args']

concurrency:
  group: appstore-swap
  cancel-in-progress: false

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography requests
      - name: 심사 바꿔 내기
        working-directory: tools
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: python3 -u appstore_swap.py $(cat appstore_swap.args) 2>&1 | tee up.log; st=${PIPESTATUS[0]}; grep -v '^::' up.log | tail -80 | sed 's/^/::notice::/'; exit $st
