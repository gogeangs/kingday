<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>문의 관리 · 왕이 되는 그날까지</title>
<!--
  대표님 전용 문의 관리 페이지 (supabase/stage8_inquiry.sql)
  - 이 페이지에는 공개용(publishable) 키만 들어 있어요. 비밀 키·비밀번호는 넣지 않아요.
  - 관리자인지는 서버가 확인해요(kd_admins 표의 이메일 + 구글·애플 로그인). 관리자가 아니면 목록이 열리지 않아요.
-->
<style>
:root{--bg:#0d1220;--panel:#171e36;--panel2:#1f2844;--text:#e8ecf6;--muted:#9aa6c1;--gold:#ffc94a;--line:rgba(255,201,74,.25);--ok:#8fe3a2;--bad:#ff8a9a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(13,18,32,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;color:var(--gold);flex:1;min-width:140px}
header small{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:12px 16px 60px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:600}
.btn.ok{background:#1e5a34;border-color:#2f8a52;color:#e3ffe9;font-weight:600}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.center{max-width:420px;margin:12vh auto 0;text-align:center}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.tabs button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:600}
.tabs .n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:rgba(0,0,0,.3);font-size:12px;text-align:center}
.tabs button.on .n{background:rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}#detail{order:-1}.grid.noSel #detail{display:none}.grid.sel #list{display:none}}
#list{display:flex;flex-direction:column;gap:8px}
.it{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.it.on{outline:2px solid var(--gold)}
.it .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.it .top time{margin-left:auto;color:var(--muted);font-size:12px}
.it p{margin:4px 0 0;font-size:13.5px;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;background:rgba(0,0,0,.35)}
.tag.k-pay{color:#ffd27a}.tag.k-bug{color:#ff9fae}.tag.k-account{color:#9fd0ff}.tag.k-etc{color:var(--muted)}
.tag.s-new{color:var(--gold);border:1px solid rgba(255,201,74,.5)}.tag.s-answered{color:var(--ok)}.tag.s-closed{color:var(--muted)}
.body{white-space:pre-wrap;word-break:break-word;background:#0b0f1a;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;font-size:15px}
.photo{display:block;max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);margin:8px 0;cursor:zoom-in}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
th,td{border-top:1px solid rgba(255,255,255,.07);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:400;width:110px;white-space:nowrap}
td{word-break:break-all}
.copy{margin-left:6px}
h3{font-size:14px;color:var(--gold);margin:16px 0 6px}
textarea{width:100%;min-height:130px;border-radius:10px;border:1px solid var(--line);background:#0b0f1a;padding:10px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row label{color:var(--muted);font-size:13px}
input[type=number]{width:90px;border-radius:8px;border:1px solid var(--line);background:#0b0f1a;padding:6px 8px}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.prev{background:rgba(143,227,162,.08);border:1px solid rgba(143,227,162,.3);border-radius:10px;padding:10px;white-space:pre-wrap;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222c4c;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw}
.back{display:none}@media (max-width:820px){.back{display:inline-block}}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style></head><body>
<header><h1>문의 관리 <small>왕이 되는 그날까지</small></h1><span id="who" class="muted"></span><button class="btn sm" id="reload" hidden>새로 고침</button><button class="btn sm" id="logout" hidden>로그아웃</button></header>
<main id="app"><div class="center card"><p class="muted">불러오는 중…</p></div></main>
<script>
'use strict';
const SB = { url: 'https://xqrdqigdwfyoaalqalfc.supabase.co', key: 'sb_publishable_b0VfItWh30lKMyHaOSehXQ_lWqe_xTM' };
const KEY = 'kd-adm';
const PAGE = location.origin + location.pathname;
const KN = { pay: '결제', bug: '버그', account: '계정', etc: '기타' };
const SN = { new: '처리 전', answered: '답변함', closed: '처리 완료' };
const PN = { kd_gem_60: '이삭 60', kd_gem_330: '이삭 330', kd_gem_680: '이삭 680', kd_gem_1280: '이삭 1280', kd_gem_3280: '이삭 3280', kd_gem_6480: '이삭 6480', kd_starter: '첫 구매 꾸러미', kd_chief: '카엘 촌장', kd_sub_monthly: '정기 배송', kd_pass: '원정 일지', kd_growth: '영주의 첫걸음', kd_ttukttak: '뚝딱이', kd_lucian: '루시안' };
const TPL = [
  ['결제 확인', '영주님, 문의 주셔서 고마워요. 결제 내역을 확인했고 황금 이삭을 이 우편으로 함께 보내 드려요. 불편을 드려 죄송해요!'],
  ['버그 접수', '영주님, 알려 주셔서 고마워요. 말씀해 주신 문제를 확인해서 다음 업데이트에서 고칠게요. 불편을 드려 죄송해요!'],
  ['고쳤어요', '영주님, 말씀해 주신 문제를 고쳤어요. 게임(앱)을 최신 버전으로 업데이트한 뒤 다시 확인해 주세요. 고마워요!'],
  ['더 알려 주세요', '영주님, 문의 고마워요. 정확히 확인하려면 조금 더 알려 주세요. 언제, 어떤 화면에서 어떤 일이 있었는지 「⚙ 설정 → 문의하기」로 다시 보내 주시면 바로 볼게요.'],
  ['계정', '영주님, 계정을 확인했어요. 「⚙ 설정 → 계정」에서 처음 연결했던 구글(또는 애플) 계정으로 로그인하면 클라우드 기록을 불러올 수 있어요.']
];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const dt = t => { if (!t) return ''; const d = new Date(t), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = t => { const m = (Date.now() - new Date(t)) / 6e4; return m < 60 ? Math.max(1, Math.round(m)) + '분 전' : m < 1440 ? Math.round(m / 60) + '시간 전' : Math.round(m / 1440) + '일 전'; };
function toast(m) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ── 로그인 (게임과 따로 이 페이지만의 로그인을 씀) ── */
let auth = null;
try { auth = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) {}
const saveAuth = () => { try { auth ? localStorage.setItem(KEY, JSON.stringify(auth)) : localStorage.removeItem(KEY); } catch (e) {} };
(function back() {
  const h = location.hash;
  if (!h || !/(access_token|error)=/.test(h)) return;
  const q = new URLSearchParams(h.slice(1));
  if (q.get('access_token')) {
    auth = { access_token: q.get('access_token'), refresh_token: q.get('refresh_token'), expires_at: +q.get('expires_at') || Math.floor(Date.now() / 1000) + (+q.get('expires_in') || 3600) };
    saveAuth();
  } else toast('로그인하지 못했어요: ' + (q.get('error_description') || q.get('error')));
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
})();
async function token() {
  if (!auth) return null;
  if (auth.expires_at * 1000 > Date.now() + 60000) return auth.access_token;
  const r = await fetch(SB.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: SB.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: auth.refresh_token }) });
  if (!r.ok) { auth = null; saveAuth(); return null; }
  const j = await r.json();
  auth = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600) };
  saveAuth();
  return auth.access_token;
}
async function rpc(fn, args) {
  const t = await token();
  if (!t) throw new Error('login');
  const r = await fetch(SB.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SB.key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
  if (!r.ok) throw new Error(fn + ' ' + r.status);
  return r.json();
}
async function storage(method, path) {
  const t = await token();
  return fetch(SB.url + '/storage/v1/object/' + (method === 'GET' ? 'authenticated/' : '') + 'inquiry/' + path, { method, headers: { apikey: SB.key, Authorization: 'Bearer ' + t } });
}
function login() { location.href = SB.url + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(PAGE); }
function logout() { auth = null; saveAuth(); location.reload(); }
$('logout').onclick = logout;

/* ── 화면 ── */
let rows = [], sel = null, tab = 'new', kind = '', busy = false;
let hid = null; /* 숨긴 랭킹 기록 (stage11_admin_hidden.sql) — null 이면 서버에 함수가 없음 */
const HK = { season: '시즌 영지', hall: '명예의 전당', goblin: '황금 고블린', tower: '시련의 탑', tower_week: '탑 주간' };
const photoUrl = {};
function loginView(msg) {
  $('app').innerHTML = `<div class="center card"><h2 style="margin:0 0 6px;color:var(--gold);font-size:19px">대표님 전용 페이지</h2><p class="muted">${msg || '관리자로 등록된 구글 계정으로 로그인해 주세요.'}</p><button class="btn pri" id="go" style="width:100%;margin-top:10px">구글로 로그인</button></div>`;
  $('go').onclick = login;
}
async function boot() {
  if (!auth) return loginView();
  $('logout').hidden = false;
  let ok = false;
  try { ok = await rpc('kd_is_admin', {}); } catch (e) {
    if (String(e.message) === 'login') return loginView('로그인이 끝났어요. 다시 로그인해 주세요.');
    $('app').innerHTML = `<div class="center card"><p>서버에 연결하지 못했어요.</p><p class="muted">${esc(e.message)} · 서버에 <b>stage8_inquiry.sql</b>을 실행했는지 확인해 주세요.</p></div>`;
    return;
  }
  try {
    const u = await (await fetch(SB.url + '/auth/v1/user', { headers: { apikey: SB.key, Authorization: 'Bearer ' + (await token()) } })).json();
    $('who').textContent = u.email || ((u.identities || [])[0] || { identity_data: {} }).identity_data.email || '';
  } catch (e) {}
  if (!ok) {
    $('app').innerHTML = `<div class="center card"><p>이 계정은 관리자가 아니에요.</p><p class="muted">Supabase SQL Editor에서 <code>kd_admins</code> 표에 이 이메일을 넣은 뒤 새로 고침해 주세요.</p><button class="btn" id="out" style="margin-top:8px">다른 계정으로 로그인</button></div>`;
    $('out').onclick = logout;
    return;
  }
  $('reload').hidden = false;
  $('reload').onclick = () => load();
  await load();
}
async function load() {
  if (busy) return;
  busy = true;
  try { rows = (await rpc('kd_adm_inq_list', {})) || []; } catch (e) { toast('목록을 불러오지 못했어요'); }
  try { hid = (await rpc('kd_adm_hidden_list', {})) || []; } catch (e) { hid = null; }
  busy = false;
  if (sel && !rows.some(r => r.id === sel)) sel = null;
  render();
}
function render() {
  const cnt = s => rows.filter(r => (!s || r.status === s) && (!kind || r.kind === kind)).length;
  const list = rows.filter(r => (!tab || r.status === tab) && (!kind || r.kind === kind));
  const tabs = [['new', '처리 전'], ['answered', '답변함'], ['closed', '처리 완료'], ['', '전체']];
  if (tab === 'hidden') return renderHidden();
  document.title = (rows.filter(r => r.status === 'new').length ? `(${rows.filter(r => r.status === 'new').length}) ` : '') + '문의 관리 · 왕이 되는 그날까지';
  $('app').innerHTML = `<div class="tabs">${tabs.map(([k, n]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${n}<span class="n">${cnt(k)}</span></button>`).join('')}${hidTab()}</div>
  <div class="tabs">${[['', '모든 종류'], ...Object.entries(KN)].map(([k, n]) => `<button data-kind="${k}" class="${kind === k ? 'on' : ''}">${n}</button>`).join('')}</div>
  <div class="grid ${sel ? 'sel' : 'noSel'}"><div id="list">${list.length ? list.map(r => `<button class="it${r.id === sel ? ' on' : ''}" data-id="${r.id}"><div class="top"><span class="tag k-${esc(r.kind)}">${KN[r.kind] || esc(r.kind)}</span><span class="tag s-${esc(r.status)}">${SN[r.status] || esc(r.status)}</span><b style="font-size:14px">${esc(r.nick || '(닉네임 없음)')}</b>${r.photo ? '<span title="사진">📷</span>' : ''}<time title="${dt(r.created_at)}">${ago(r.created_at)}</time></div><p>${esc(r.body)}</p></button>`).join('') : '<div class="empty">문의가 없어요.</div>'}</div>
  <div id="detail">${detailHtml()}</div></div>`;
  document.querySelectorAll('[data-tab]').forEach(b => (b.onclick = () => { tab = b.dataset.tab; render(); }));
  document.querySelectorAll('[data-kind]').forEach(b => (b.onclick = () => { kind = b.dataset.kind; render(); }));
  document.querySelectorAll('[data-id]').forEach(b => (b.onclick = () => { sel = +b.dataset.id; render(); scrollTo(0, 0); }));
  bindDetail();
}
/* ── 숨긴 랭킹 기록: 속도 검사에 걸려 랭킹에서 빠진 기록. 진짜 플레이로 보이면 「다시 보이기」 ── */
function hidTab() { return `<button data-tab="hidden" class="${tab === 'hidden' ? 'on' : ''}" style="margin-left:auto">숨긴 랭킹 기록<span class="n">${hid ? hid.length : '-'}</span></button>`; }
function renderHidden() {
  const tabs = [['new', '처리 전'], ['answered', '답변함'], ['closed', '처리 완료'], ['', '전체']];
  const body = hid == null
    ? '<div class="empty">서버에 <b>stage11_admin_hidden.sql</b>을 실행하면 볼 수 있어요.</div>'
    : hid.length
      ? `<p class="muted">속도 검사(너무 빨리 오른 기록)에 걸려 랭킹에서 빠진 기록이에요. 시험 계정이나 조작이 아니고 진짜로 플레이한 기록이면 「다시 보이기」를 누르세요. 이미 끝난 시즌·주의 보상은 다시 주지 않으니 필요하면 문의 답변으로 이삭을 보내 주세요.</p>
        <div id="list">${hid.map((r, i) => `<div class="it"><div class="top"><span class="tag">${HK[r.kind] || esc(r.kind)}${r.kind === 'season' ? ' ' + r.key : r.kind === 'goblin' || r.kind === 'tower_week' ? ' ' + r.key + '주' : ''}</span><b style="font-size:14px">${esc(r.nick || '(닉네임 없음)')}</b>${r.guest ? '<span class="tag">게스트</span>' : ''}<time title="${dt(r.at)}">${ago(r.at)}</time></div>
          <p>${r.kind === 'goblin' ? '처치 ' + r.value + '마리' : r.kind === 'tower' || r.kind === 'tower_week' ? r.value + '층' : '영지 ' + r.value}${r.best ? ' · 최고 영지 ' + r.best : ''}${r.gem != null ? ' · 이삭 ' + r.gem : ''}${r.email ? ' · ' + esc(r.email) : ''}</p>
          <div class="row"><code style="font-size:11px">${esc(r.user_id)}</code><button class="btn sm" data-unhide="${i}">다시 보이기</button></div></div>`).join('')}</div>`
      : '<div class="empty">숨긴 기록이 없어요.</div>';
  $('app').innerHTML = `<div class="tabs">${tabs.map(([k, n]) => `<button data-tab="${k}">${n}</button>`).join('')}${hidTab()}</div>${body}`;
  document.querySelectorAll('[data-tab]').forEach(b => (b.onclick = () => { tab = b.dataset.tab; render(); }));
  document.querySelectorAll('[data-unhide]').forEach(b => (b.onclick = async () => {
    const r = hid[+b.dataset.unhide];
    if (!confirm(`${r.nick || '이 영주'}의 ${HK[r.kind] || r.kind} 기록을 랭킹에 다시 보일까요?`)) return;
    b.disabled = true;
    try {
      const res = await rpc('kd_adm_hidden_set', { p_kind: r.kind, p_key: r.key, p_user: r.user_id, p_hidden: false });
      toast(res === 'ok' ? '랭킹에 다시 보여요' : '기록을 찾지 못했어요');
      await load();
    } catch (e) { toast('바꾸지 못했어요'); b.disabled = false; }
  }));
}
function detailHtml() {
  const r = rows.find(x => x.id === sel);
  if (!r) return `<div class="card empty">왼쪽에서 문의를 고르세요.</div>`;
  const buys = Array.isArray(r.buys) ? r.buys : [];
  return `<div class="card"><button class="btn sm back" id="back">← 목록</button>
  <div class="row" style="margin-top:4px"><span class="tag k-${esc(r.kind)}">${KN[r.kind] || esc(r.kind)}</span><span class="tag s-${esc(r.status)}">${SN[r.status] || esc(r.status)}</span><span class="muted">#${r.id} · ${dt(r.created_at)}</span></div>
  <div class="body">${esc(r.body)}</div>
  ${r.photo ? `<img class="photo" id="photo" alt="문의 사진" src="${photoUrl[r.photo] || ''}"><p class="muted" id="photoMsg">${photoUrl[r.photo] ? '' : '사진을 불러오는 중…'}</p>` : ''}
  <h3>보낸 사람</h3>
  <table>
   <tr><th>닉네임</th><td>${esc(r.nick || '-')}</td></tr>
   <tr><th>계정 번호</th><td><code>${esc(r.user_id)}</code><button class="btn sm copy" data-copy="${esc(r.user_id)}">복사</button></td></tr>
   <tr><th>계정</th><td>${r.guest ? '게스트' : '연결됨'}${r.email ? ' · ' + esc(r.email) : ''}</td></tr>
   <tr><th>게임</th><td>${esc(r.platform || '-')} · ${esc(r.app_ver || '-')}</td></tr>
   <tr><th>기기</th><td>${esc(r.device || '-')}</td></tr>
   <tr><th>진행</th><td>${r.stage ? '영지 ' + r.stage + ' · 이삭 ' + Number(r.gem || 0).toLocaleString() + ' (클라우드 저장 기준)' : '클라우드 저장 없음'}</td></tr>
   <tr><th>이 계정 문의</th><td>${r.inq_count}번</td></tr>
   <tr><th>최근 결제</th><td>${buys.length ? buys.map(b => `${dt(b.at)} · ${esc(PN[b.product] || b.product)} · ${esc(b.platform)}${b.order ? ' · <code>' + esc(b.order) + '</code>' : ''}`).join('<br>') : '없음'}</td></tr>
  </table>
  ${r.answer ? `<h3>보낸 답변 · ${dt(r.answered_at)}</h3><div class="prev">${esc(r.answer)}</div>` : ''}
  ${r.status === 'closed' ? `<div class="row"><span class="muted">${dt(r.closed_at)} 처리 완료</span><button class="btn" id="reopen">다시 열기</button></div>` : `
  <h3>${r.answer ? '답 다시 보내기' : '답 쓰기'} <span class="muted">· 게임 우편함으로 가요</span></h3>
  <div class="tpl">${TPL.map(([n], i) => `<button class="btn sm" data-tpl="${i}">${n}</button>`).join('')}</div>
  <textarea id="ans" maxlength="1000" placeholder="영주님께 보낼 답을 적어 주세요 (1000자까지)"></textarea>
  <div class="row"><label for="gem">함께 보낼 황금 이삭</label><input type="number" id="gem" min="0" max="10000" step="10" value="0"><span class="muted">0이면 보상 없이 답만</span></div>
  <div class="row"><button class="btn pri" id="send">답 보내기 (우편)</button><button class="btn ok" id="close">처리 완료${r.photo ? ' (사진 지움)' : ''}</button></div>`}
  </div>`;
}
function bindDetail() {
  const r = rows.find(x => x.id === sel);
  if (!r) return;
  $('back').onclick = () => { sel = null; render(); };
  document.querySelectorAll('[data-copy]').forEach(b => (b.onclick = () => { navigator.clipboard.writeText(b.dataset.copy).then(() => toast('복사했어요')); }));
  if (r.photo && !photoUrl[r.photo]) {
    storage('GET', r.photo).then(async res => {
      if (!res.ok) throw 0;
      photoUrl[r.photo] = URL.createObjectURL(await res.blob());
      if (sel === r.id && $('photo')) { $('photo').src = photoUrl[r.photo]; $('photoMsg').textContent = ''; }
    }).catch(() => { if ($('photoMsg')) $('photoMsg').textContent = '사진을 불러오지 못했어요.'; });
  }
  if ($('photo')) $('photo').onclick = () => { if (photoUrl[r.photo]) window.open(photoUrl[r.photo], '_blank'); };
  document.querySelectorAll('[data-tpl]').forEach(b => (b.onclick = () => {
    const t = $('ans'); t.value = TPL[+b.dataset.tpl][1]; t.focus();
  }));
  if ($('reopen')) $('reopen').onclick = async () => { await setStatus(r, 'new', false); };
  if ($('send')) $('send').onclick = async () => {
    const a = $('ans').value.trim(), gem = Math.max(0, Math.min(10000, Math.floor(+$('gem').value || 0)));
    if (!a) return toast('답을 적어 주세요');
    if (!confirm(`「${r.nick || '이 영주'}」에게 답을 우편으로 보낼까요?${gem ? `\n황금 이삭 ${gem}개도 함께 보내요.` : ''}`)) return;
    $('send').disabled = true;
    try {
      const res = await rpc('kd_adm_inq_answer', { p_id: r.id, p_answer: a, p_reward: gem ? { gem } : {} });
      if (res !== 'ok') throw new Error(res);
      toast('답을 보냈어요');
      await load();
    } catch (e) { toast('보내지 못했어요: ' + e.message); if ($('send')) $('send').disabled = false; }
  };
  if ($('close')) $('close').onclick = async () => {
    if (!confirm(r.photo ? '처리 완료로 바꾸고 사진을 지울까요? (사진은 되살릴 수 없어요)' : '처리 완료로 바꿀까요?')) return;
    let gone = false;
    if (r.photo) {
      try { const res = await storage('DELETE', r.photo); gone = res.ok; } catch (e) {}
      if (!gone) toast('사진은 지우지 못했어요. 처리 완료만 바꿔요');
    }
    await setStatus(r, 'closed', gone);
  };
}
async function setStatus(r, st, gone) {
  try {
    const res = await rpc('kd_adm_inq_status', { p_id: r.id, p_status: st, p_photo_gone: !!gone });
    if (res !== 'ok') throw new Error(res);
    toast(st === 'closed' ? '처리 완료로 바꿨어요' : '다시 열었어요');
    await load();
  } catch (e) { toast('바꾸지 못했어요: ' + e.message); }
}
boot();
setInterval(() => { if (!document.hidden && $('reload') && !$('reload').hidden && !$('ans')?.value) load(); }, 120000);
</script></body></html>
