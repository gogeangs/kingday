 {k:'chest',n:'상자 사냥꾼',d:'성유물 상자 Lv.10',ok:()=>S.boxLv>=10},

 {k:'champ',n:'시즌 챔피언',d:'시즌 랭킹 1위 보상',ok:()=>false,rk:1},

 {k:'crown1',n:'전당의 금관',d:'명예의 전당 1위 보상',ok:()=>false,rk:1},
 {k:'crown2',n:'전당의 은관',d:'명예의 전당 2위 보상',ok:()=>false,rk:1},

 const hb=$('hBadge');if(hb){const bs=S.badge&&bdHas(S.badge)?'assets/profile/badge_'+S.badge+'.png':'';if(!bs)hb.hidden=true;else{hb.hidden=false;if(!hb.src.endsWith(bs))hb.src=bs}}
 {const fb=$('faceBtn');if(fb){fb.classList.toggle('newpf',!S.pfSeen);fb.classList.toggle('pfdot',!!S.pfSeen&&!!S.pfNew&&Object.keys(S.pfNew).length>0)}}

 $('sheet').innerHTML=`<div class="hdban" style="--hb:url(assets/ui/hd_profile.png)"><span>프로필</span></div><div class="pfhead"><div class="pfbig"><canvas id="pfCv"></canvas><img class="pfr${pfTall(cur)}" src="assets/profile/frame_${cur}.png" alt=""></div><div class="pfinfo"><b>카엘${S.badge&&bdHas(S.badge)?`<img class="pfbd" src="assets/profile/badge_${S.badge}.png" alt="">`:''}</b><small class="pfnick">닉네임 <b>${esc(S.nick||'준비 중')}</b>${S.nickTemp?' <i>임시</i>':''}${sbOn()?'<button class="buy" id="pfNick">'+(S.nickTemp||!S.nick?'정하기':'바꾸기')+'</button>':''}</small><small>${RANKS[ri].n} · 전투력 ${fmt(power())}</small><small>최고 영지 ${Math.min(S.best,MAXLAND)} · 은퇴 ${S.retires||0}번 · 은퇴의 추억 ${S.memory||0}개</small></div></div>

function settingsSheet(step){

 $('setImp').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('setCode').value.trim()))));if(!d||typeof d.gold!=='number')throw 0;noSave=true;localStorage.setItem(KEY,JSON.stringify(d));location.reload()}catch(e){toast('저장 코드가 올바르지 않아요')}};

/* 황금 이삭 → 골드: 지금 영지에서 사냥으로 버는 골드 N시간치 */
const GOLDX=[{k:'g1',n:'골드 주머니',gem:30,h:2},{k:'g2',n:'골드 자루',gem:100,h:8},{k:'g3',n:'골드 금고',gem:250,h:24}];
function goldRate(){const dps=members().reduce((a,id)=>{const t=stats(id);return a+t.atk*t.aps*(1+t.crit)},0),tpk=monHp(S.stage,false)/Math.max(1,dps)+1.2;return reward(S.stage,false)/tpk*memMul()}
const goldX=x=>Math.max(100,Math.floor(goldRate()*3600*x.h));

 const dps=members().reduce((a,id)=>{const t=stats(id);return a+t.atk*t.aps*(1+t.crit)},0),tpk=monHp(S.stage,false)/dps+1.2,g=Math.floor(sec/tpk*reward(S.stage,false)*.5*memMul()*(subOn()?1.5:1));if(g<=0)return;
