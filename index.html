<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왕이 되는 그날까지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: 한 화면 세로형 — 위 원정대 전투 캔버스, 가운데 요약, 아래 장비/원정대/단련/마을/지도 탭. 밤하늘 남색 위에 성검 금색 하나만 강조 */
:root{
  --bg:#141a29; --panel:#1f2740; --panel2:#29334f; --line:#37436a;
  --fg:#eef1f8; --muted:#97a2c3; --gold:#ffc94a; --gold-ink:#3a2a00;
  --bad:#ff6b7d; --good:#7be08f;
  --f-display:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;min-width:0}
.stage small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goldpill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 55%,#c98a10);box-shadow:inset 0 -2px 0 #a8700a}
.stagewrap{position:relative;flex:0 0 auto;height:min(36vh,250px);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.pips{position:absolute;left:10px;top:10px;display:flex;gap:4px}
.pip{width:10px;height:10px;border-radius:3px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25)}
.pip.on{background:var(--gold);border-color:var(--gold)}
.pip.boss{width:16px;background:rgba(80,0,10,.5);border-color:var(--bad)}
.pip.boss.on{background:var(--bad)}
.buffs{position:absolute;right:10px;top:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
.buff{font-size:11px;background:rgba(0,0,0,.5);border:1px solid rgba(255,201,74,.6);color:var(--gold);border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
.bossbar{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.55);border-radius:8px;padding:6px 8px;font-size:12px;display:flex;align-items:center;gap:8px}
.bossbar #bossName{max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bossbar .track{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.bossbar .fill{height:100%;background:var(--bad);width:100%}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat.power b{color:var(--gold)}
.tabs{display:flex;gap:5px}
.tab{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:14px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--fg);border-color:var(--panel2)}
.tab .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.panel{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
.sec{font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);text-align:right}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;cursor:pointer;color:var(--fg);font:inherit}
.slot svg{width:30px;height:30px}
.slot .nm{font-size:12px;color:var(--muted)}
.slot .lv{font-family:var(--f-display);font-weight:700;font-size:14px}
.slot.empty{opacity:.55;border-style:dashed}
.box{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.boxhead b{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--fg)}
.xp{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.xp div{height:100%;background:var(--gold)}
.odds{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-variant-numeric:tabular-nums}
.odds span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c);margin-right:4px}
.toggles{display:flex;gap:8px 14px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.tg input{accent-color:var(--gold);width:16px;height:16px}
.open{font-family:var(--f-display);font-weight:700;font-size:19px;border:0;border-radius:12px;padding:12px;background:var(--gold);color:var(--gold-ink);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 4px 0 #b9850f}
.open:active{transform:translateY(2px);box-shadow:0 2px 0 #b9850f}
.open:disabled{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}
.open small{font-size:14px;opacity:.75}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px}
.row .info{flex:1;min-width:0}
.row .info b{font-family:var(--f-display);font-weight:700;font-size:15px}
.row .info div{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5}
.lvtag{font-size:12px;color:var(--gold);margin-left:4px;font-family:var(--f-body)}
.row.locked{opacity:.6}
.portrait{width:56px;height:68px;flex:0 0 auto;border-radius:10px;background:var(--panel2)}
.role{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted);font-family:var(--f-body);vertical-align:2px}
.buy{font-family:var(--f-display);font-weight:700;font-size:14px;border:0;border-radius:10px;padding:9px 10px;background:var(--gold);color:var(--gold-ink);cursor:pointer;min-width:84px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.buy:disabled{background:var(--panel2);color:var(--muted);cursor:default}
.buy.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.buy.ghost:disabled{color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.village{height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto}
.mapwrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto;height:440px}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--panel2);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.plot{border-radius:10px;border:1px solid #5a4030;background:#3a2a20;color:var(--fg);font:inherit;font-size:11px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;font-variant-numeric:tabular-nums}
.plot .sp{width:22px;height:22px;border-radius:50% 50% 40% 40%;background:var(--c,#5a4030)}
.plot.empty .sp{background:transparent;border:1px dashed #8a6a50}
.plot.ready{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.plot.ready b{color:var(--gold)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns .buy{flex:1}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .xp div{background:var(--good)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.kv b{color:var(--fg);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(6,9,18,.75);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;width:100%;max-width:400px;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;text-align:center;text-wrap:balance}
.sheet .eyebrow{text-align:center;font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:-6px}
.lore{margin:0;font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.85;color:var(--fg);text-wrap:pretty}
.lore.q{color:var(--gold)}
.lore.k{color:#a8e6b0}
.lore .who{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.08em;opacity:.75}
.lore.sys{font-family:var(--f-body);font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:2px solid var(--c,var(--line));border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;background:var(--panel2)}
.card svg{width:40px;height:40px;color:var(--c)}
.card .g{font-size:12px;color:var(--c)}
.card .t{font-family:var(--f-display);font-weight:700;font-size:15px}
.card .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.card .cap{font-size:11px;color:var(--muted);letter-spacing:.06em}
.diff{text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px}
.up{color:var(--good)} .down{color:var(--bad)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts.one{grid-template-columns:1fr}
.acts button{font-family:var(--f-display);font-weight:700;font-size:16px;border-radius:12px;padding:11px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.acts button:disabled{opacity:.45;cursor:default}
.acts .pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s;pointer-events:none}
@media (prefers-reduced-motion:reduce){.open:active{transform:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="stage"><span id="stLabel">개울 마을</span><small id="stRegion">에르단 평원 · 영지 1/10</small></div>
    <div class="goldpill"><i class="coin" aria-hidden="true"></i><span id="gold">0</span></div>
  </header>

  <div class="stagewrap" id="wrap">
    <canvas id="cv" aria-label="원정대 자동 전투 화면"></canvas>
    <div class="pips" id="pips"></div>
    <div class="buffs" id="buffs"></div>
    <div class="bossbar" id="bossbar" hidden><span id="bossName">보스</span><div class="track"><div class="fill" id="bossfill"></div></div><span id="bosst">30초</span></div>
  </div>

  <section class="hero" aria-label="원정대 요약">
    <div class="stat power"><b id="hPow">0</b><span>전투력</span></div>
    <div class="stat"><b id="hParty">1/5</b><span>원정대</span></div>
    <div class="stat"><b id="hRank">농부</b><span>칭호</span></div>
    <div class="stat"><b id="hLand">0/50</b><span>되찾은 영지</span></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="eq" aria-selected="true">장비</button>
    <button class="tab" role="tab" data-t="pt" aria-selected="false">원정대</button>
    <button class="tab" role="tab" data-t="up" aria-selected="false">단련</button>
    <button class="tab" role="tab" data-t="vl" aria-selected="false">마을</button>
    <button class="tab" role="tab" data-t="mp" aria-selected="false">지도</button>
  </nav>

  <main class="panel" id="p-eq">
    <div class="sec">카엘의 장비 <small>행상인 피트의 성유물은 카엘만 착용해요</small></div>
    <div class="slots" id="slots"></div>
    <div class="box">
      <div class="boxhead"><b id="boxLv">성유물 상자 Lv.1</b><span id="boxXpT">0 / 10</span></div>
      <div class="xp"><div id="boxXp" style="width:0%"></div></div>
      <div class="odds" id="odds"></div>
      <div class="toggles">
        <label class="tg"><input type="checkbox" id="autoSell"> 약한 장비 바로 판매</label>
        <label class="tg"><input type="checkbox" id="autoOpen"> 자동 열기</label>
      </div>
      <button class="open" id="openBtn">상자 열기 <small id="openCost">20</small></button>
    </div>
  </main>

  <main class="panel" id="p-pt" hidden>
    <div class="sec">평민 원정대 <small>앞줄이 먼저 공격을 받아요</small></div>
    <div id="party" style="display:flex;flex-direction:column;gap:8px"></div>
  </main>

  <main class="panel" id="p-up" hidden>
    <div class="sec">카엘 단련</div>
    <div id="upgs" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="box" id="retireBox"></div>
  </main>

  <main class="panel" id="p-vl" hidden>
    <div class="village"><canvas id="vc" aria-label="마을 모습"></canvas></div>
    <div class="box" id="farmBox"></div>
    <div class="box" id="kitchen"></div>
    <div class="sec">마을 재건 <small>건물마다 원정대가 강해져요</small></div>
    <div id="blds" style="display:flex;flex-direction:column;gap:8px"></div>
  </main>

  <main class="panel" id="p-mp" hidden>
    <div class="mapwrap"><canvas id="mc" aria-label="에르단 대륙 영지 탈환 지도"></canvas></div>
    <div class="box" id="mapInfo"></div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" style="opacity:0"></div>

<script>
const $=id=>document.getElementById(id);
/* ---------- 데이터 ---------- */
const ICONS={
 weapon:'<path fill="currentColor" d="M19 2l3 3-11 11-3-3zM5.5 13.5l5 5-1.6 1.6-1.4-1.4-2.6 2.6-1.4-1.4 2.6-2.6-1.4-1.4z"/>',
 helm:'<path fill="currentColor" d="M3 15a9 9 0 0118 0v2H3zM2 18h20v3H2z"/><path fill="rgba(0,0,0,.35)" d="M11 6h2v9h-2z"/>',
 armor:'<path fill="currentColor" d="M8 2l4 2.5L16 2l5 3.5-2.5 4.5V22h-13V10L3 5.5z"/>',
 gloves:'<path fill="currentColor" d="M7 22v-9L4.5 9.5l1.8-1.3L8.5 11V4a1.2 1.2 0 012.4 0v6V3a1.2 1.2 0 012.4 0v7V4a1.2 1.2 0 012.4 0v7.5l1.6-1.8 1.4 1.2-3.3 5V22z"/>',
 boots:'<path fill="currentColor" d="M6 2h7v11l7 3.2V22H6z"/><path fill="rgba(0,0,0,.35)" d="M6 19h14v1.5H6z"/>',
 ring:'<circle cx="12" cy="15" r="6" fill="none" stroke="currentColor" stroke-width="2.6"/><path fill="currentColor" d="M8.5 3h7L12 9z"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
const SLOTS=[{k:'weapon',n:'검 장식',a:1,h:0},{k:'helm',n:'모자',a:0,h:1},{k:'armor',n:'작업복',a:0,h:1.6},{k:'gloves',n:'장갑',a:.6,h:.3},{k:'boots',n:'장화',a:.3,h:.6},{k:'ring',n:'반지',a:.5,h:.4}];
const GRADES=[{n:'일반',c:'#b9c0cf',m:1},{n:'고급',c:'#6fd17a',m:1.6},{n:'희귀',c:'#5aa9ff',m:2.5},{n:'영웅',c:'#b77cff',m:4},{n:'전설',c:'#ffb03b',m:6.5},{n:'신화',c:'#ff5d73',m:11}];
const BASE_ODDS=[70,22,6,1.6,.35,.05];
const REGIONS=[
 {n:'에르단 평원',sky:['#3d5f94','#9ab8cf'],hill:'#36624a',hill2:'#4f7d55',ground:'#4f7a3a',kind:'slime',col:'#8fbf4f',mn:'역병 점액',boss:'역병의 군단장 모르바스',
  terr:['개울 마을','풍차 언덕','밀밭 길','갈대 강변','옛 장터','방앗간','늪지 초소','썩은 우물','양조장 터','역병의 둥지'],
  lore:['왕국의 곡창지대였던 평원을 역병의 군단장 모르바스가 차지했다. 그가 지나간 땅은 썩고, 썩은 이슬은 점액이 되어 마을을 덮친다.','k:…밭을 썩게 만든다고? 그건 좀 용서가 안 되는데.']},
 {n:'어스름 숲',sky:['#1f2448','#5c4d80'],hill:'#1c362f',hill2:'#2a4a40',ground:'#34502d',kind:'bat',col:'#9a72d6',mn:'밤그늘 박쥐',boss:'밤의 군단장 세릴',
  terr:['숲 어귀','이끼 오솔길','버섯 골짜기','꺼진 등불 터','거미 덤불','요정의 샘','고목 다리','달 없는 호수','가시 성채','밤의 둥지'],
  lore:['밤의 군단장 세릴이 요정들의 빛을 빼앗아 숲을 영원한 밤에 가뒀다.','q:이 숲 어딘가에 아직 빛을 지킨 요정이 살아 있다. 서둘러라, 주인.']},

/* ---------- 장비 ---------- */
function rollItem(){
 const o=odds();let r=Math.random()*100,g=0;for(;g<5;g++){if(r<o[g])break;r-=o[g]}
 const sl=SLOTS[Math.floor(Math.random()*SLOTS.length)],lv=Math.max(1,S.stage+Math.floor(Math.random()*4)-2),m=GRADES[g].m,v=()=>.9+Math.random()*.2;
 return{slot:sl.k,g,lv,atk:Math.round(3*m*lv*sl.a*v()),hp:Math.round(20*m*lv*sl.h*v()),price:Math.floor(boxCost()*.25*(1+g))}
}
const slotName=k=>SLOTS.find(s=>s.k===k).n;
function statLine(it){const p=[];if(it.atk)p.push('공격 +'+fmt(it.atk));if(it.hp)p.push('체력 +'+fmt(it.hp));return p.join(' · ')}
function gainBoxXp(){if(S.boxLv>=10)return;S.boxXp++;if(S.boxXp>=xpNeed()){S.boxXp=0;S.boxLv++;toast('피트가 더 좋은 물건을 들여왔어요. 성유물 상자 Lv.'+S.boxLv)}}
let pending=null;
function openBox(auto){
 const c=boxCost();if(S.gold<c||pending)return;
 S.gold-=c;gainBoxXp();const it=rollItem(),cur=S.eq[it.slot];
 if(auto){if(score(it)>score(cur)){if(cur)S.gold+=cur.price;S.eq[it.slot]=it;flashSlot(it.slot)}else S.gold+=it.price;renderAll();return}
 if(S.autoSell&&cur&&score(it)<=score(cur)){S.gold+=it.price;toast(GRADES[it.g].n+' '+slotName(it.slot)+' 판매 +'+fmt(it.price));renderAll();return}
 pending=it;showItem(it,cur);renderAll();
}
function card(it,cap){
 if(!it)return`<div class="card"><span class="cap">${cap}</span><div class="t" style="color:var(--muted);padding:22px 0">비어 있음</div></div>`;
 const G=GRADES[it.g];return`<div class="card" style="--c:${G.c}"><span class="cap">${cap}</span>${svg(it.slot)}<span class="g">${G.n}</span><span class="t">${slotName(it.slot)} Lv.${it.lv}</span><span class="s">${statLine(it)}</span></div>`
}
const LUMQ=['흥, 내 격에는 한참 못 미친다.','그럭저럭… 봐줄 만하군.','오호, 제법이다!','이건 왕의 물건이다. 당장 걸쳐라!','300년 만에 보는 물건이군…!','신화… 주인, 이건 운명이다.'];
function showItem(it,cur){
 const d=score(it)-score(cur);
 $('sheet').innerHTML=`<h2>성유물을 얻었어요</h2><div class="cmp">${card(it,'새 장비')}${card(cur,'착용 중')}</div>
 <div class="diff ${d>0?'up':d<0?'down':''}">전투력 ${d>=0?'▲':'▼'} ${fmt(Math.abs(d))}</div>${para('q:'+LUMQ[it.g])}
 <div class="acts"><button id="mSell">판매 +${fmt(it.price)}</button><button class="pri" id="mEq">장착</button></div>`;
 $('modal').hidden=false;
 $('mEq').onclick=()=>{const c=S.eq[it.slot];if(c)S.gold+=c.price;S.eq[it.slot]=it;closeModal();flashSlot(it.slot);if(c)toast('이전 장비 판매 +'+fmt(c.price))};
 $('mSell').onclick=()=>{S.gold+=it.price;closeModal()};$('mEq').focus();
}
function closeModal(){$('modal').hidden=true;pending=null;renderAll();pump()}

/* ---------- 밭 · 부엌 · 마을 ---------- */
function ensurePlots(){const n=plotCount();while(S.plots.length<n)S.plots.push(null)}
function plotState(p){if(!p)return{st:'empty'};const c=CROPS.find(x=>x.k===p.k),left=c.t-(Date.now()-p.at)/1000;return left<=0?{st:'ready',c}:{st:'grow',c,left,ratio:1-left/c.t}}
function plant(i,k){if(S.seeds[k]<=0||S.plots[i])return;S.seeds[k]--;S.plots[i]={k,at:Date.now()};farmSig='';renderAll()}
function harvest(i){const ps=plotState(S.plots[i]);if(ps.st!=='ready')return 0;const n=2+(Math.random()<.3?1:0);S.items[ps.c.k]+=n;S.plots[i]=null;return n}
function produce(){const now=Date.now();for(const g of GOODS){const l=S.bld[g.b];if(!l){S.prod[g.b]=now;continue}const iv=120000/l;if(!S.prod[g.b])S.prod[g.b]=now;const n=Math.min(2000,Math.floor((now-S.prod[g.b])/iv));if(n>0){S.items[g.k]+=n;S.prod[g.b]+=n*iv}}}
function chooseSeed(i){
 $('sheet').innerHTML=`<h2>무엇을 심을까요?</h2>${CROPS.map(c=>`<div class="row" style="background:var(--panel2)"><div class="info"><b>${c.n}</b><div>자라는 시간 ${mmss(c.t)} · 씨앗 ${S.seeds[c.k]}개</div></div><button class="buy" id="sd-${c.k}" ${S.seeds[c.k]?'':'disabled'}>심기</button></div>`).join('')}<div class="acts one"><button id="mX">닫기</button></div>`;
 $('modal').hidden=false;CROPS.forEach(c=>$('sd-'+c.k).onclick=()=>{plant(i,c.k);closeModal()});$('mX').onclick=closeModal;
}
let farmSig='';
function renderFarm(){
 const fb=$('farmBox');
 if(!S.bld.farm){if(farmSig!=='locked'){farmSig='locked';fb.innerHTML=`<div class="sec">카엘의 밭 <small>잠김</small></div><p class="note">역병에 물든 땅이라 아직 아무것도 자라지 않아요. 개울 마을을 되찾으면 마르타 할머니가 돌아와 밭을 일궈 줘요.</p>`}return}
 ensurePlots();
 const seeds=CROPS.map(c=>`<span class="chip" style="--c:${c.c}"><i></i>${c.n} 씨앗 ${S.seeds[c.k]}</span>`).join('');
 const cells=S.plots.map((p,i)=>{const ps=plotState(p);
  if(ps.st==='empty')return`<button class="plot empty" data-i="${i}"><span class="sp"></span><span>빈 밭</span><b>심기</b></button>`;
  if(ps.st==='ready')return`<button class="plot ready" data-i="${i}" style="--c:${ps.c.c}"><span class="sp"></span><span>${ps.c.n}</span><b>수확</b></button>`;
  return`<button class="plot" data-i="${i}" style="--c:color-mix(in srgb,${ps.c.c} ${Math.round(30+ps.ratio*50)}%,#3a2a20)"><span class="sp" style="transform:scale(${(.4+ps.ratio*.6).toFixed(2)})"></span><span>${ps.c.n}</span><b>${mmss(ps.left)}</b></button>`}).join('');
 const anyReady=S.plots.some(p=>plotState(p).st==='ready'),anyEmpty=S.plots.some(p=>!p)&&CROPS.some(c=>S.seeds[c.k]>0);
 const sig=seeds+cells+anyReady+anyEmpty;if(sig===farmSig)return;farmSig=sig;
 fb.innerHTML=`<div class="sec">카엘의 밭 <small>Lv.${S.bld.farm} · ${S.plots.length}칸 · 카엘의 진짜 꿈</small></div><div class="inv">${seeds}</div><div class="plots">${cells}</div>
  <div class="btns"><button class="buy ghost" id="plantAll" ${anyEmpty?'':'disabled'}>모두 심기</button><button class="buy" id="harvAll" ${anyReady?'':'disabled'}>모두 수확</button></div>
  <p class="note">씨앗은 마물이 가끔 떨어뜨려요. 작물은 게임을 꺼 둔 동안에도 자라요.</p>`;
 fb.querySelectorAll('.plot').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ps=plotState(S.plots[i]);if(ps.st==='empty')chooseSeed(i);else if(ps.st==='ready'){const n=harvest(i);toast(ps.c.n+' '+n+'개 수확. 카엘이 행복해 보여요');farmSig='';renderAll()}else toast(ps.c.n+' · '+mmss(ps.left)+' 뒤에 수확')});
 $('plantAll').onclick=()=>{S.plots.forEach((p,i)=>{if(p)return;const c=[...CROPS].reverse().find(c=>S.seeds[c.k]>0);if(c)plant(i,c.k)})};
 $('harvAll').onclick=()=>{let t=0;S.plots.forEach((p,i)=>t+=harvest(i));toast('작물 '+t+'개 수확');farmSig='';renderAll()};
}
let kitSig='';
function renderKitchen(){
 const kb=$('kitchen');
 if(!S.bld.farm){kb.hidden=true;return}kb.hidden=false;
 const now=Date.now(),keys=Object.keys(S.items),val=keys.reduce((a,k)=>a+S.items[k]*itemPrice(k),0);
 const chips=[...CROPS,...GOODS].filter(c=>S.items[c.k]>0||CROPS.includes(c)||S.bld[c.b]).map(c=>`<span class="chip" style="--c:${c.c}"><i></i>${c.n} ${S.items[c.k]}</span>`).join('');
 const rows=RECIPES.map(r=>{const ok=Object.entries(r.need).every(([k,n])=>S.items[k]>=n),need=Object.entries(r.need).map(([k,n])=>ITEMN[k]+' '+n).join(', '),left=((S.buffs[r.buff]||0)-now)/1000;
  return`<div class="row" style="background:var(--panel2)"><div class="info"><b>${r.n}</b>${left>0?`<span class="lvtag">${mmss(left)} 남음</span>`:''}<div>${r.desc} · 10분</div><div>재료: ${need}</div></div><button class="buy" data-r="${r.k}" ${ok?'':'disabled'}>요리</button></div>`}).join('');
 const sig=chips+rows+val;if(sig===kitSig)return;kitSig=sig;
 kb.innerHTML=`<div class="sec">${S.joined.margo?'마고의 식당':'마을 부엌'} <small>요리하면 원정대가 강해져요</small></div><div class="inv">${chips}</div>${rows}
  <button class="buy ghost" id="sellAll" ${val>0?'':'disabled'}>창고 물건 모두 판매 +${fmt(val)}</button>`;
 kb.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=RECIPES.find(x=>x.k===b.dataset.r);if(!Object.entries(r.need).every(([k,n])=>S.items[k]>=n))return;for(const[k,n]of Object.entries(r.need))S.items[k]-=n;S.buffs[r.buff]=Math.max(Date.now(),S.buffs[r.buff]||0)+600000;toast(r.n+' 완성! '+r.desc);kitSig='';renderAll()});
 $('sellAll').onclick=()=>{S.gold+=val;keys.forEach(k=>S.items[k]=0);toast('창고 판매 +'+fmt(val));kitSig='';renderAll()};
}
let bldSig='';
function renderBlds(){
 const sig=JSON.stringify(S.bld)+JSON.stringify(S.joined)+S.done.marta;
 if(sig!==bldSig){bldSig=sig;
  $('blds').innerHTML=BLD.map(b=>{const l=S.bld[b.k],op=b.open(),mx=l>=b.max;
   if(!op)return`<div class="row locked"><div class="info"><b>${b.n}</b><span class="lvtag">폐허</span><div>${b.lock}</div></div></div>`;
   return`<div class="row"><div class="info"><b>${b.n}</b><span class="lvtag">${l?'Lv.'+l:'폐허'}</span><div>${b.who?b.who+'의 '+b.n+' · ':''}${l?b.eff(l):'아직 무너져 있어요'}${mx?'':' → '+b.eff(l+1)}</div></div><button class="buy" id="bd-${b.k}" ${mx?'disabled':''}>${mx?'최대':(l?'':'재건 ')+fmt(bldCost(b,l))}</button></div>`}).join('');
  BLD.forEach(b=>{const el=$('bd-'+b.k);if(el)el.onclick=()=>{const l=S.bld[b.k],c=bldCost(b,l);if(l>=b.max||S.gold<c)return;S.gold-=c;S.bld[b.k]++;if(!l)S.prod[b.k]=Date.now();toast(b.n+(l?' 확장':' 재건')+' 완료! '+b.eff(l+1));farmSig='';kitSig='';renderAll()}})}
 BLD.forEach(b=>{const el=$('bd-'+b.k);if(el&&S.bld[b.k]<b.max)el.disabled=S.gold<bldCost(b,S.bld[b.k])});
}

/* ---------- 원정대 · 단련 · 지도 ---------- */
let partySig='';
function renderParty(){
 const sig=JSON.stringify(S.lv)+JSON.stringify(S.joined)+JSON.stringify(S.bld)+JSON.stringify(S.up)+JSON.stringify(S.eq)+buff('atk')+rankIdx()+S.memory;
 if(sig!==partySig){partySig=sig;
  $('party').innerHTML=ORDER.map(id=>{const c=COMP[id],has=id==='kael'||S.joined[id];
   if(!has)return`<div class="row locked"><canvas class="portrait" id="pf-${id}"></canvas><div class="info"><b>???</b><span class="role">${c.role}</span><div>${c.join}</div></div></div>`;
   const t=stats(id),line=`공격 ${fmt(t.atk)} · 체력 ${fmt(t.hp)}`;
   if(id==='kael')return`<div class="row"><canvas class="portrait" id="pf-${id}"></canvas><div class="info"><b>${c.n}</b><span class="role">${c.role}</span><div>${c.desc}</div><div>${line}</div></div><button class="buy ghost" id="goEq">장비</button></div>`;
   return`<div class="row"><canvas class="portrait" id="pf-${id}"></canvas><div class="info"><b>${c.n}</b><span class="role">${c.role}</span><span class="lvtag">Lv.${S.lv[id]}</span><div>${c.desc}</div><div>${line}</div></div><button class="buy" id="lv-${id}">${fmt(compCost(S.lv[id]))}</button></div>`}).join('');
  ORDER.forEach(id=>{portrait(id);const b=$('lv-'+id);if(b)b.onclick=()=>{const c=compCost(S.lv[id]);if(S.gold<c)return;S.gold-=c;S.lv[id]++;if(P[id])P[id].hp+=COMP[id].per.hp;renderAll()}});
  const g=$('goEq');if(g)g.onclick=()=>setTab('eq')}
 ORDER.forEach(id=>{const b=$('lv-'+id);if(b)b.disabled=S.gold<compCost(S.lv[id])});
}
let retSig='';
function renderRetire(){
 const t=retireTarget(),pct=Math.min(100,S.gold/t*100),pts=retirePts(),can=S.stage>=20;
 const sig=[fmt(S.gold),fmt(t),pts,can,S.memory].join();if(sig===retSig)return;retSig=sig;
 $('retireBox').innerHTML=`<div class="sec">카엘의 은퇴 계획 <small>은퇴의 추억 ${S.memory}개 · 모든 능력치와 골드 +${S.memory*5}%</small></div>
  <div class="meter"><div class="kv"><span>은퇴 자금</span><b>${fmt(S.gold)} / ${fmt(t)}</b></div><div class="xp"><div style="width:${pct.toFixed(1)}%"></div></div></div>
  <p class="note">영지를 되찾을수록 목표 금액이 올라가요. 카엘은 아직 이 사실을 몰라요.</p>
  <button class="buy" id="retireBtn" ${can?'':'disabled'}>${can?'은퇴하기 · 추억 +'+pts:'영지 19곳을 되찾으면 은퇴할 수 있어요'}</button>`;
 $('retireBtn').onclick=()=>{if(S.stage<20)return;const p=retirePts();queue(()=>scene('은퇴하기','드디어 은퇴?',['k:좋아, 이 정도면 충분해. 난 밭으로 돌아간다.','q:주인! 아직 왕좌가…!','sys:되찾은 영지, 골드, 장비, 단련, 동료 레벨이 처음으로 돌아가요. 마을 건물, 밭, 동료 합류, 상자 레벨은 유지돼요. 은퇴의 추억 '+p+'개를 얻어 모든 능력치와 골드 획득이 영구히 '+(p*5)+'% 늘어나요.'],'은퇴한다',{label:'아직은 아니야',go:()=>retire(p)}))};
}
function retire(p){
 S.memory+=p;S.retires++;S.gold=60;S.stage=1;S.wave=0;S.eq={};S.up={atk:0,hp:0,spd:0,crit:0};for(const k in S.lv)S.lv[k]=1;S.rankSeen=0;
 for(const id in P)delete P[id];mons=[];$('bossbar').hidden=true;syncParty();
 queue(()=>scene('몇 년 뒤','…다시 끌려 나오다',['평화로운 3년이었다. 카엘은 매일 밭을 갈았고, 호박은 해마다 커졌다.','그러던 어느 날, 마계의 문이 다시 열렸다.','q:일어나라, 주인. 은퇴는 끝났다.','k:…왜 또 나야.'],'괭이 대신 검을 든다'));chapter();renderAll()}
let mapSig='';
function renderMapInfo(){
 const c=landCount(),ri=rankIdx(),nx=RANKS[ri+1],r=region(S.stage);
 const sig=[S.stage,ri].join();if(sig===mapSig)return;mapSig=sig;
 $('mapInfo').innerHTML=`<div class="sec">${S.stage>MAXLAND?'왕도 아스테리온':terrName(S.stage)} 탈환 중 <small>${r.n} · ${(S.stage-1)%10+1}/10</small></div>
  <div class="kv"><span>되찾은 영지</span><b>${c} / ${MAXLAND}</b></div>
  <div class="kv"><span>지금 칭호</span><b>${RANKS[ri].n} (원정대 +${ri*4}%)</b></div>
  <div class="kv"><span>다음 칭호</span><b>${nx?nx.n+'까지 '+(nx.at-c)+'곳':'왕도 탈환만 남았어요'}</b></div>
  <div class="kv"><span>이 지역의 지배자</span><b>${r.boss}</b></div>
  <p class="note">영지마다 마족 성주가 지키고, 지역의 마지막 영지에는 군단장이 있어요. 다섯 군단을 모두 몰아내면 왕도로 가는 길이 열려요.</p>`;
}

/* ---------- 공통 렌더 ---------- */
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,2000)}
let eqSig='',upSig='',boxSig='';
function renderSlots(){
 $('slots').innerHTML=SLOTS.map(s=>{const it=S.eq[s.k];if(!it)return`<button class="slot empty" id="sl-${s.k}">${svg(s.k)}<span class="nm">${s.n}</span><span class="lv">—</span></button>`;
  const G=GRADES[it.g];return`<button class="slot" id="sl-${s.k}" style="border-color:${G.c};color:${G.c}">${svg(s.k)}<span class="nm">${G.n} ${s.n}</span><span class="lv" style="color:var(--fg)">Lv.${it.lv}</span></button>`}).join('');
 SLOTS.forEach(s=>$('sl-'+s.k).onclick=()=>{const it=S.eq[s.k];toast(it?GRADES[it.g].n+' '+s.n+' · '+statLine(it):s.n+' 칸이 비어 있어요. 상자를 열어 보세요')});
}
function flashSlot(k){const el=$('sl-'+k);if(el&&el.animate)el.animate([{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:260})}
function renderUpg(){
 $('upgs').innerHTML=UPG.map(u=>{const l=S.up[u.k],mx=l>=u.max;return`<div class="row"><div class="info"><b>${u.n}</b><span class="lvtag">Lv.${l}</span><div>${u.val(l)}${mx?' · 최대':' → '+u.next(l)}</div></div><button class="buy" id="up-${u.k}" ${mx?'disabled':''}>${mx?'최대':fmt(u.cost(l))}</button></div>`}).join('');
 UPG.forEach(u=>$('up-'+u.k).onclick=()=>{const l=S.up[u.k],c=u.cost(l);if(l>=u.max||S.gold<c)return;S.gold-=c;S.up[u.k]++;if(u.k==='hp'&&P.kael)P.kael.hp+=20;renderAll()});
}
function renderBox(){
 $('boxLv').textContent='성유물 상자 Lv.'+S.boxLv+(S.boxLv>=10?' (최대)':'');
 $('boxXpT').textContent=S.boxLv>=10?'최대 레벨':S.boxXp+' / '+xpNeed();
 $('boxXp').style.width=(S.boxLv>=10?100:S.boxXp/xpNeed()*100)+'%';
 const o=odds();$('odds').innerHTML=GRADES.map((g,i)=>`<span style="--c:${g.c}">${g.n} ${o[i]<1?o[i].toFixed(2):o[i].toFixed(1)}%</span>`).join('');
}
function renderAll(){
 if(!S)return;const r=region(S.stage);
 $('gold').textContent=fmt(S.gold);
 $('stLabel').textContent=S.stage>MAXLAND?'왕도 진격로':terrName(S.stage);
 $('stRegion').textContent=r.n+' · 영지 '+((S.stage-1)%10+1)+'/10 · 스테이지 '+S.stage;
 $('hPow').textContent=fmt(power());$('hParty').textContent=members().length+'/5';$('hRank').textContent=RANKS[rankIdx()].n;$('hLand').textContent=landCount()+'/'+MAXLAND;
 const c=boxCost();$('openCost').textContent=fmt(c);$('openBtn').disabled=S.gold<c||!!pending;
 const es=JSON.stringify(S.eq);if(es!==eqSig){eqSig=es;renderSlots()}
 const bs=S.boxLv+':'+S.boxXp;if(bs!==boxSig){boxSig=bs;renderBox()}
 const us=JSON.stringify(S.up);if(us!==upSig){upSig=us;renderUpg()}
 UPG.forEach(u=>{const b=$('up-'+u.k);if(b&&S.up[u.k]<u.max)b.disabled=S.gold<u.cost(S.up[u.k])});
 renderParty();renderBlds();renderFarm();renderKitchen();renderRetire();renderMapInfo();
 const boss=mons.some(m=>m.boss);
 $('pips').innerHTML=Array.from({length:10},(_,i)=>`<i class="pip${i<S.wave?' on':''}"></i>`).join('')+`<i class="pip boss${boss?' on':''}"></i>`;

 queue(()=>{$('sheet').innerHTML=`<div class="eyebrow">돌아온 카엘</div><h2>영지에서 세금이 걷혔어요</h2><div class="card" style="--c:var(--gold)"><span class="cap">${hr?hr+'시간 ':''}${mn}분 동안</span><div class="t" style="font-size:28px;color:var(--gold)">+${fmt(g)}</div><span class="s">되찾은 영지의 백성들이 보낸 골드예요${S.bld.farm?' · 밭의 작물도 자랐어요':''}</span></div>${para('k:…이 돈, 은퇴 자금으로 모아 둬도 되죠?')}<div class="acts one"><button class="pri" id="mGo">받기</button></div>`;$('modal').hidden=false;$('mGo').onclick=closeModal;$('mGo').focus()});
}

/* ---------- 시작 ---------- */
let last=0,autoT=0,saveT=0,uiT=0;
function loop(ts){const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;step(dt);
 autoT+=dt;if(S.autoOpen&&autoT>.9&&$('modal').hidden){autoT=0;openBox(true)}
 saveT+=dt;if(saveT>5){saveT=0;save()}
 uiT+=dt;if(uiT>.4){uiT=0;produce();renderAll()}
 draw();if(curTab==='vl')drawVillage();if(curTab==='mp')drawMap();
 requestAnimationFrame(loop)}
function start(data){
 S=(data&&typeof data.gold==='number')?hydrate(data):(load()||hydrate({gold:60}));
 $('autoSell').checked=S.autoSell;$('autoOpen').checked=S.autoOpen;
 const isNew=!S.started;S.started=true;S.v=3;syncParty();resize();produce();
 if(isNew)intro();else offline();
 events();renderAll();requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{if(S)save()});
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
