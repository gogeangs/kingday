<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왕이 되는 그날까지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: 한 화면 세로형 — 위 원정대 전투 캔버스, 가운데 요약, 아래 장비/원정대/단련/마을/지도 탭. 밤하늘 남색 위에 성검 금색 하나만 강조 */
:root{
  --bg:#141a29; --panel:#1f2740; --panel2:#29334f; --line:#37436a;
  --fg:#eef1f8; --muted:#97a2c3; --gold:#ffc94a; --gold-ink:#3a2a00;
  --bad:#ff6b7d; --good:#7be08f;
  --f-display:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#0a0d16;color:var(--fg);font-family:var(--f-body);padding:0;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.hud{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(#0d1220,#141a29);border-bottom:1px solid #2a3350;z-index:6}
.face{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#3b5a8a,#1a2440);overflow:hidden;flex:0 0 auto;padding:0;cursor:pointer}
.face canvas{width:100%;height:100%}
.who{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.who .nm{font-family:var(--f-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.rank{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:1px 7px}
.pow{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.pow::before{content:"⚔";font-size:12px}
.goldpill{display:flex;align-items:center;gap:6px;background:#0b0f1a;border:1px solid #3a4568;border-radius:999px;padding:5px 12px 5px 6px;font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.coinimg{width:26px;height:26px;margin:-4px -2px -4px -4px}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 55%,#c98a10);box-shadow:inset 0 -2px 0 #a8700a}
.stagewrap{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ovtop{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding-inline:12px}
.stagepill{background:linear-gradient(rgba(10,14,26,.88),rgba(20,26,41,.82));border:1px solid rgba(255,201,74,.55);border-radius:12px;padding:6px 14px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:200px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.stagepill b{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.02em}
.stagepill small{font-size:11px;color:var(--muted);margin-top:-4px}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.pip.on{background:var(--gold)}
.pip.boss{width:22px;height:22px;border-radius:50%;background:#3a1420;border:2px solid var(--bad);display:grid;place-items:center;font-size:10px;line-height:1;margin-left:3px}
.pip.boss::after{content:"";width:22px;height:22px;background:url(assets/ui/ui_boss_mark.png) center/contain no-repeat}
.pip.boss{overflow:visible}
.pip.boss.on{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.buffs{position:absolute;left:10px;top:128px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.buff{font-size:11px;background:rgba(0,0,0,.55);border:1px solid rgba(255,201,74,.6);color:var(--gold);border-radius:999px;padding:2px 8px 2px 2px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.buff img{width:26px;height:26px;margin:-4px 0}
.bossbar{position:absolute;left:50%;transform:translateX(-50%);top:90px;width:min(300px,80%);background:rgba(10,14,26,.8);border:1px solid rgba(255,107,125,.6);border-radius:10px;padding:5px 9px;font-size:12px;display:flex;align-items:center;gap:8px}
.bossbar #bossName{max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bossbar .track{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.bossbar .fill{height:100%;background:var(--bad);width:100%}
.ovbottom{position:absolute;left:0;right:0;bottom:0;padding:24px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;gap:8px;background:linear-gradient(transparent,rgba(10,14,26,.85) 40%)}
.prow{flex:1;min-width:0;display:flex;gap:6px}
.pcard{width:min(52px,17%);display:flex;flex-direction:column;gap:3px;cursor:pointer;padding:0;background:none;border:0}
.pcard .pic{aspect-ratio:1;width:100%;border-radius:9px;border:2px solid #c9952a;background:linear-gradient(#2c4a7a,#18233d);overflow:hidden;position:relative}
.pcard.down .pic{filter:grayscale(1) brightness(.6)}
.pcard canvas{width:100%;height:100%}
.pcard .hp{height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.pcard .hp i{display:block;height:100%;background:var(--good)}
.pcard.empty .pic{border-color:#3a4568;border-style:dashed;background:rgba(0,0,0,.3)}
.qbtns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.qbtn{width:52px;height:52px;border-radius:50%;border:2px solid #c9952a;background:radial-gradient(circle at 50% 35%,#3a2a12,#16110a);color:var(--gold);font-family:var(--f-display);font-weight:700;font-size:15px;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.qbtn.on{background:radial-gradient(circle at 50% 35%,#ffd66b,#c98a10);color:var(--gold-ink)}
.qbtn img{width:40px;height:40px}
.qbtn small{position:absolute;margin-top:46px;font-size:10px;color:var(--fg);font-family:var(--f-body);font-weight:600;white-space:nowrap;text-shadow:0 1px 2px #000}
.qbtn:disabled{filter:grayscale(.8) brightness(.7)}
.tabs{display:flex;gap:4px;padding-block:6px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:linear-gradient(#1a2135,#0d1220);border-top:2px solid #6b5420;z-index:6}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--f-display);font-weight:700;font-size:12px;padding:4px 0 3px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;position:relative}
.tab img{width:40px;height:40px;object-fit:contain;filter:saturate(.7) brightness(.85)}
.tab[aria-selected="true"]{background:linear-gradient(#5a4515,#2a2010);border-color:var(--gold);color:var(--gold)}
.tab[aria-selected="true"] img{filter:none}
.tab .dot{position:absolute;top:3px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:1px solid #fff}
.page{position:absolute;inset:0;z-index:5;background:linear-gradient(#18203a,#141a29 30%);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:0 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;background:linear-gradient(#18203a 75%,rgba(24,32,58,0));}
.phead h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px}
.pclose{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:16px;cursor:pointer}
.eqstage{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;align-items:center;background:radial-gradient(ellipse at 50% 60%,#3a2a1a,#1a1410 70%);border:1px solid #4a3a22;border-radius:14px;padding:12px}
.eqcol{display:flex;flex-direction:column;gap:8px}
.eqhero{height:190px}
.slot{position:relative;aspect-ratio:1;width:100%;max-width:76px;justify-self:center;margin-inline:auto;background:none;border:0;padding:0;cursor:pointer;color:var(--fg);font:inherit}
.slot .fr{position:absolute;inset:0;width:100%;height:100%}
.slot .ic{position:absolute;inset:16%;width:68%;height:68%;object-fit:contain}
.slot svg{position:absolute;inset:26%;width:48%;height:48%}
.slot .lv{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-family:var(--f-display);font-weight:700;font-size:11px;text-shadow:0 1px 2px #000}
.slot.empty .ic{opacity:.35;filter:grayscale(1)}
.eqstats{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.eqstats b{color:var(--fg);float:right}
.title{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:56px 24px calc(48px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(10,14,26,.94),rgba(10,14,26,.2) 34%,rgba(10,14,26,.2) 52%,rgba(10,14,26,.98) 78%)}
.title .titlebg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;z-index:-1;animation:none;filter:none}
.title{isolation:isolate}
.title img{width:min(340px,90%);filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));animation:float 4s ease-in-out infinite}
.title .tsub{background:rgba(10,14,26,.6);padding:4px 12px;border-radius:999px;font-family:var(--f-display);font-size:14px;color:#fff;text-shadow:0 1px 4px #000;text-align:center}
.title .tstart{font-family:var(--f-display);font-weight:700;font-size:22px;border:2px solid #fff3c4;border-radius:14px;padding:14px 48px;background:linear-gradient(#ffd66b,#e0a020);color:var(--gold-ink);cursor:pointer;box-shadow:0 5px 0 #a8700a,0 10px 24px rgba(0,0,0,.4)}
.title .tlogo-fallback{font-family:var(--f-display);font-weight:700;font-size:40px;color:var(--gold);text-shadow:0 3px 0 #6b4a10}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.title img{animation:none}}
.sec{font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);text-align:right}
.box{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.boxhead b{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--fg)}
.xp{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.xp div{height:100%;background:var(--gold)}
.odds{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-variant-numeric:tabular-nums}
.odds span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c);margin-right:4px}
.toggles{display:flex;gap:8px 14px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.tg input{accent-color:var(--gold);width:16px;height:16px}
.open{font-family:var(--f-display);font-weight:700;font-size:19px;border:0;border-radius:12px;padding:12px;background:var(--gold);color:var(--gold-ink);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 4px 0 #b9850f}
.open:active{transform:translateY(2px);box-shadow:0 2px 0 #b9850f}
.open:disabled{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}
.open small{font-size:14px;opacity:.75}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px}
.row .info{flex:1;min-width:0}
.row .info b{font-family:var(--f-display);font-weight:700;font-size:15px}
.row .info div{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5}
.lvtag{font-size:12px;color:var(--gold);margin-left:4px;font-family:var(--f-body)}
.row.locked{opacity:.6}
.portrait{width:56px;height:68px;flex:0 0 auto;border-radius:10px;background:var(--panel2)}
.role{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted);font-family:var(--f-body);vertical-align:2px}
.buy{font-family:var(--f-display);font-weight:700;font-size:14px;border:0;border-radius:10px;padding:9px 10px;background:var(--gold);color:var(--gold-ink);cursor:pointer;min-width:84px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.buy:disabled{background:var(--panel2);color:var(--muted);cursor:default}
.buy.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.buy.ghost:disabled{color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.village{aspect-ratio:3/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto}
.mapwrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto;height:440px}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--panel2);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip img{width:18px;height:18px;margin:-2px 0}
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.plot{border-radius:10px;border:1px solid #5a4030;background:#3a2a20;color:var(--fg);font:inherit;font-size:11px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;font-variant-numeric:tabular-nums}
.plot .sp{width:22px;height:22px;border-radius:50% 50% 40% 40%;background:var(--c,#5a4030)}
.plot.empty .sp{background:transparent;border:1px dashed #8a6a50}
.plot.ready{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.plot.ready b{color:var(--gold)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns .buy{flex:1}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .xp div{background:var(--good)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.kv b{color:var(--fg);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(6,9,18,.75);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;width:100%;max-width:400px;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;text-align:center;text-wrap:balance}
.sheet .eyebrow{text-align:center;font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:-6px}
.lore{margin:0;font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.85;color:var(--fg);text-wrap:pretty}
.lore.q{color:var(--gold)}
.lore.k{color:#a8e6b0}
.lore .who{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.08em;opacity:.75}
.talk{display:flex;gap:10px;align-items:flex-end;margin:0}
.talk .pface{width:64px;height:64px;flex:0 0 auto;border-radius:12px;background:radial-gradient(circle at 50% 40%,#2c4a7a,#141a29);border:2px solid #c9952a;object-fit:cover;object-position:50% 20%}
.talk.m .pface{border-color:#ffd9a8;object-position:50% 30%}
.talk.q .pface{background:radial-gradient(circle at 50% 50%,#203a66,#0d1220);border-color:#5ab4ff;object-position:50% 40%}
.talk .lore{flex:1;min-width:0;background:rgba(0,0,0,.22);border-radius:12px;padding:8px 12px}
.rowic{width:52px;height:52px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.row.locked .rowic,.row.ruin .rowic{filter:grayscale(1) brightness(.6)}.row.ruin .rowic.art{filter:none}.row.locked .rowic.art{filter:brightness(.6)}
.chipic{width:20px;height:20px;margin:-3px 0}
.rankimg{width:28px;height:28px;margin:-6px -2px}
.rankbig{display:block;width:96px;height:96px;margin:0 auto 4px}
.sheet{border:22px solid transparent;border-image:url(assets/ui/frame_popup.png) 70 fill / 22px stretch;background:var(--panel) padding-box;border-radius:0;padding:10px 6px 8px}
.bossportrait{display:block;width:120px;height:120px;margin:0 auto 6px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(255,60,60,.35))}
.bossface{width:34px;height:34px;margin:-10px 0 -10px -4px;object-fit:cover;object-position:50% 15%;border-radius:50%;border:2px solid var(--bad);background:#2a0e14}
.illust{display:block;width:calc(100% + 12px);margin:-10px -6px 4px;aspect-ratio:16/10;object-fit:cover;object-position:50% 45%;border-radius:4px}
.illust.il-prologue{object-position:50% 34%}
.illust.il-retire{object-position:50% 48%}
.lore.sys{font-family:var(--f-body);font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:2px solid var(--c,var(--line));border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;background:var(--panel2)}
.card svg{width:40px;height:40px;color:var(--c)}
.card .g{font-size:12px;color:var(--c)}
.card .t{font-family:var(--f-display);font-weight:700;font-size:15px}
.card .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.card .cap{font-size:11px;color:var(--muted);letter-spacing:.06em}
.diff{text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px}
.up{color:var(--good)} .down{color:var(--bad)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts.one{grid-template-columns:1fr}
.acts button{font-family:var(--f-display);font-weight:700;font-size:16px;border-radius:12px;padding:11px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.acts button:disabled{opacity:.45;cursor:default}
.acts .pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s;pointer-events:none}
@media (prefers-reduced-motion:reduce){.open:active{transform:none}}
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <button class="face" id="faceBtn" aria-label="원정대 보기"><canvas id="faceCv"></canvas></button>
    <div class="who"><span class="nm">카엘 <img class="rankimg" id="hRankImg" src="assets/ui/rank_farmer.png" alt="" onerror="this.remove()"><span class="rank" id="hRank">농부</span></span><span class="pow" id="hPow">0</span></div>
    <div class="goldpill"><img class="coinimg" src="assets/ui/ui_gold.png" alt="" onerror="this.outerHTML='<i class=&quot;coin&quot;></i>'"><span id="gold">0</span></div>
  </header>

  <div class="stagewrap" id="wrap">
    <canvas id="cv" aria-label="원정대 자동 전투 화면"></canvas>

function fmt(n){n=Math.floor(n);if(n<1e4)return n.toLocaleString('ko-KR');const u=['','K','M','B','T','aa','ab','ac'];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]}

function kStats(){let ga=0,gh=0;for(const s of SLOTS){const it=S.eq[s.k];if(it){ga+=it.atk;gh+=it.hp}}const fm=1+.06*S.bld.mine,m=allMul();
 return{atk:(10+S.up.atk*3+ga*fm)*(buff('atk')?1.2:1)*m,hp:(100+S.up.hp*20+gh*fm)*(1+.05*S.bld.diner)*m,aps:(1+S.up.spd*.05)*(buff('spd')?1.2:1),crit:(5+S.up.crit)/100}}

function rollItem(){
 const o=odds();let r=Math.random()*100,g=0;for(;g<5;g++){if(r<o[g])break;r-=o[g]}
 const sl=SLOTS[Math.floor(Math.random()*SLOTS.length)],lv=Math.max(1,S.stage+Math.floor(Math.random()*4)-2),m=GRADES[g].m,v=()=>.9+Math.random()*.2;
 return{slot:sl.k,g,lv,atk:Math.round(3*m*lv*sl.a*v()),hp:Math.round(20*m*lv*sl.h*v()),price:Math.floor(boxCost()*.25*(1+g))}
}
const slotName=k=>SLOTS.find(s=>s.k===k).n;
function statLine(it){const p=[];if(it.atk)p.push('공격 +'+fmt(it.atk));if(it.hp)p.push('체력 +'+fmt(it.hp));return p.join(' · ')}
function gainBoxXp(){if(S.boxLv>=10)return;S.boxXp++;if(S.boxXp>=xpNeed()){S.boxXp=0;S.boxLv++;toast('피트가 더 좋은 물건을 들여왔어요. 성유물 상자 Lv.'+S.boxLv)}}

 if(auto){if(score(it)>score(cur)){if(cur)S.gold+=cur.price;S.eq[it.slot]=it;flashSlot(it.slot)}else S.gold+=it.price;renderAll();return}
 if(S.autoSell&&cur&&score(it)<=score(cur)){S.gold+=it.price;toast(GRADES[it.g].n+' '+slotName(it.slot)+' 판매 +'+fmt(it.price));renderAll();return}
 pending=it;showItem(it,cur);renderAll();
}

function ensurePlots(){const n=plotCount();while(S.plots.length<n)S.plots.push(null)}
function plotState(p){if(!p)return{st:'empty'};const c=CROPS.find(x=>x.k===p.k),left=c.t-(Date.now()-p.at)/1000;return left<=0?{st:'ready',c}:{st:'grow',c,left,ratio:1-left/c.t}}
function plant(i,k){if(S.seeds[k]<=0||S.plots[i])return;S.seeds[k]--;S.plots[i]={k,at:Date.now()};farmSig='';renderAll()}
function harvest(i){const ps=plotState(S.plots[i]);if(ps.st!=='ready')return 0;const n=2+(Math.random()<.3?1:0);S.items[ps.c.k]+=n;S.plots[i]=null;return n}
function produce(){const now=Date.now();for(const g of GOODS){const l=S.bld[g.b];if(!l){S.prod[g.b]=now;continue}const iv=120000/l;if(!S.prod[g.b])S.prod[g.b]=now;const n=Math.min(2000,Math.floor((now-S.prod[g.b])/iv));if(n>0){S.items[g.k]+=n;S.prod[g.b]+=n*iv}}}
function chooseSeed(i){
 $('sheet').innerHTML=`<h2>무엇을 심을까요?</h2>${CROPS.map(c=>`<div class="row" style="background:var(--panel2)">${uiImg('seed_'+c.k)}<div class="info"><b>${c.n}</b><div>자라는 시간 ${mmss(c.t)} · 씨앗 ${S.seeds[c.k]}개</div></div><button class="buy" id="sd-${c.k}" ${S.seeds[c.k]?'':'disabled'}>심기</button></div>`).join('')}<div class="acts one"><button id="mX">닫기</button></div>`;
 $('modal').hidden=false;CROPS.forEach(c=>$('sd-'+c.k).onclick=()=>{plant(i,c.k);closeModal()});$('mX').onclick=closeModal;

 const fb=$('farmBox');
 if(!S.bld.farm){if(farmSig!=='locked'){farmSig='locked';fb.innerHTML=`<div class="sec">카엘의 밭 <small>잠김</small></div><p class="note">역병에 물든 땅이라 아직 아무것도 자라지 않아요. 개울 마을을 되찾으면 마르타 할머니가 돌아와 밭을 일궈 줘요.</p>`}return}
 ensurePlots();
 const seeds=CROPS.map(c=>`<span class="chip" style="--c:${c.c}">${uiImg('seed_'+c.k,'chipic')}${c.n} 씨앗 ${S.seeds[c.k]}</span>`).join('');
 const cells=S.plots.map((p,i)=>{const ps=plotState(p);
  if(ps.st==='empty')return`<button class="plot empty" data-i="${i}"><span class="sp"></span><span>빈 밭</span><b>심기</b></button>`;
  if(ps.st==='ready')return`<button class="plot ready" data-i="${i}" style="--c:${ps.c.c}"><span class="sp"></span><span>${ps.c.n}</span><b>수확</b></button>`;
  return`<button class="plot" data-i="${i}" style="--c:color-mix(in srgb,${ps.c.c} ${Math.round(30+ps.ratio*50)}%,#3a2a20)"><span class="sp" style="transform:scale(${(.4+ps.ratio*.6).toFixed(2)})"></span><span>${ps.c.n}</span><b>${mmss(ps.left)}</b></button>`}).join('');

function offline(){
 const cap=(6+S.bld.inn)*3600,sec=Math.min(cap,(Date.now()-S.last)/1000);if(sec<60)return;
 const dps=members().reduce((a,id)=>{const t=stats(id);return a+t.atk*t.aps*(1+t.crit)},0),tpk=monHp(S.stage,false)/dps+1.2,g=Math.floor(sec/tpk*reward(S.stage,false)*.5*memMul());if(g<=0)return;
 S.gold+=g;const hr=Math.floor(sec/3600),mn=Math.floor(sec%3600/60);
 queue(()=>{$('sheet').innerHTML=`<div class="eyebrow">돌아온 카엘</div><h2>영지에서 세금이 걷혔어요</h2><div class="card" style="--c:var(--gold)"><span class="cap">${hr?hr+'시간 ':''}${mn}분 동안</span><div class="t" style="font-size:28px;color:var(--gold)">+${fmt(g)}</div><span class="s">되찾은 영지의 백성들이 보낸 골드예요${S.bld.farm?' · 밭의 작물도 자랐어요':''}</span></div>${para('k:…이 돈, 은퇴 자금으로 모아 둬도 되죠?')}<div class="acts one"><button class="pri" id="mGo">받기</button></div>`;$('modal').hidden=false;$('mGo').onclick=closeModal;$('mGo').focus()});
}

/* ---------- 시작 ---------- */
let last=0,autoT=0,saveT=0,uiT=0;
function loop(ts){const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;step(dt*(S.speed===2?2:1));
 autoT+=dt;if(S.autoOpen&&autoT>.9&&$('modal').hidden){autoT=0;openBox(true)}
 saveT+=dt;if(saveT>5){saveT=0;save()}
 uiT+=dt;if(uiT>.4){uiT=0;produce();renderAll()}
 draw();if(curTab==='vl')drawVillage();if(curTab==='mp')drawMap();
 requestAnimationFrame(loop)}
function start(data){
 loadSprites();loadMonSprites();loadBgs();loadFx();BANNER.src='assets/ui/banner_capture.png';
 S=(data&&typeof data.gold==='number')?hydrate(data):(load()||hydrate({gold:60}));
 $('autoSell').checked=S.autoSell;$('autoOpen').checked=S.autoOpen;
 const isNew=!S.started;S.started=true;S.v=3;syncParty();resize();produce();renderSpeed();
 if(isNew)intro();else offline();
 faceTo($('faceCv'),'kael');
 $('startBtn').onclick=()=>{$('title').hidden=true;titleOpen=false;faceTo($('faceCv'),'kael');pump()};
 events();renderAll();requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{if(S)save()});
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
