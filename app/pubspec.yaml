name: kingday
description: "왕이 되는 그날까지 — 은퇴만 꿈꾸는 농부 카엘의 영지 탈환 방치형 RPG (Flutter + Flame 네이티브 앱)"
publish_to: "none"

# 스토어 버전: 이름(사람이 보는 버전)+빌드 번호(올릴 때마다 1씩 증가)
version: 0.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  # 그림은 저장소 맨 위 assets/ 를 tools/sync_app_assets.py 가 app/assets/game/ 으로 복사해서 씁니다.
  # (웹과 앱이 같은 그림을 쓰고, 복사본은 git에 올리지 않음)
  # 단계가 진행될 때마다 필요한 폴더를 여기에 추가합니다.
  assets:
    - assets/game/characters/
    - assets/game/monsters/
    - assets/game/bg/
    - assets/game/fx/
    - assets/game/skills/
    - assets/game/portraits/
    - assets/game/ui/
    - assets/game/gem/
    - assets/game/illust/

# ── 앱 아이콘 (dart run flutter_launcher_icons) ──
flutter_launcher_icons:
  image_path: "../assets/icon/app_icon_1024.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  # 안드로이드 적응형 아이콘: 그림 전체를 배경으로 깔고, 위에는 투명 이미지
  adaptive_icon_background: "../assets/icon/app_icon_1024.png"
  adaptive_icon_foreground: "tool/icon_fg_empty.png"

# ── 시작 화면 (dart run flutter_native_splash:create) ──
flutter_native_splash:
  color: "#0a0d16"
  image: "../assets/ui/logo.png"
  android_12:
    color: "#0a0d16"
    image: "tool/splash_icon_android12.png"
  fullscreen: true
  web: false
